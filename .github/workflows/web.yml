name: Web app

on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the refreshed site on the default branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Also copies the built app to the repo root (web/scripts/publish-site.mjs).
      - run: npm run build

      # GitHub Pages serves the repo root of the default branch ("Deploy from a
      # branch"), so the built copy there must match the source in web/.
      # On the default branch a stale copy is refreshed and committed; anywhere
      # else it fails, asking for `npm run build` to be committed.
      - name: Keep the published site in sync
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -A -- . ':!web'
          if git diff --cached --quiet; then
            echo "The published site in the repo root is up to date."
            exit 0
          fi
          git diff --cached --stat
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update published site from web/"
            git push
          else
            echo "::error::The site in the repo root is out of date. Run 'npm run build' in web/ and commit the result."
            exit 1
          fi
